<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc">
  <title id="title">Union-Find 기본 개념: 다섯 원소의 그룹 합치기</title>
  <desc id="desc">처음에는 1부터 5까지 각각 독립된 그룹이다. union 1 2 후 1과 2가 한 그룹, union 3 4 후 3과 4가 한 그룹, union 2 3 후 1부터 4까지 하나의 그룹이 된다. 5는 독립적으로 남는다. 같은 그룹의 원소는 find 결과가 같다.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #1e293b; }
      .title { font-size: 27px; font-weight: 800; }
      .subtitle { font-size: 16px; fill: #475569; }
      .card-title { font-size: 19px; font-weight: 750; }
      .label { font-size: 14px; fill: #475569; }
      .num { font-size: 22px; font-weight: 800; text-anchor: middle; dominant-baseline: middle; }
      .root { font-size: 13px; font-weight: 700; fill: #1d4ed8; }
    </style>
    <g id="circle"><circle r="25" fill="#fff" stroke="#94a3b8" stroke-width="2"/></g>
  </defs>

  <rect width="1120" height="650" fill="#f8fafc"/>
  <text x="38" y="49" class="title">Union-Find: 그룹을 합치고 대표를 찾기</text>
  <text x="38" y="76" class="subtitle">같은 색 테두리 안의 원소는 한 그룹이다. 각 그룹에는 대표가 하나 있다.</text>

  <rect x="35" y="105" width="510" height="220" rx="20" fill="#fff" stroke="#dbe3eb" stroke-width="2"/>
  <circle cx="69" cy="139" r="19" fill="#64748b"/><text x="69" y="146" text-anchor="middle" style="font-size:18px;font-weight:800;fill:#fff">1</text>
  <text x="101" y="146" class="card-title">처음: 모두 다른 그룹</text>
  <text x="64" y="177" class="label">parent[x] = x, 각 숫자가 자기 그룹의 대표</text>
  <g transform="translate(95 240)"><use href="#circle"/><text class="num">1</text></g>
  <g transform="translate(192 240)"><use href="#circle"/><text class="num">2</text></g>
  <g transform="translate(289 240)"><use href="#circle"/><text class="num">3</text></g>
  <g transform="translate(386 240)"><use href="#circle"/><text class="num">4</text></g>
  <g transform="translate(483 240)"><use href="#circle"/><text class="num">5</text></g>
  <text x="68" y="295" class="label">{1}       {2}       {3}       {4}       {5}</text>

  <rect x="575" y="105" width="510" height="220" rx="20" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <circle cx="609" cy="139" r="19" fill="#2563eb"/><text x="609" y="146" text-anchor="middle" style="font-size:18px;font-weight:800;fill:#fff">2</text>
  <text x="641" y="146" class="card-title">union(1, 2): 두 그룹 합치기</text>
  <text x="604" y="177" class="label">1이 대표라면 parent[2] = 1</text>
  <rect x="605" y="200" width="187" height="80" rx="38" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <g transform="translate(654 240)"><use href="#circle"/><text class="num">1</text></g>
  <g transform="translate(743 240)"><use href="#circle"/><text class="num">2</text></g>
  <g transform="translate(836 240)"><use href="#circle"/><text class="num">3</text></g>
  <g transform="translate(926 240)"><use href="#circle"/><text class="num">4</text></g>
  <g transform="translate(1032 240)"><use href="#circle"/><text class="num">5</text></g>
  <text x="635" y="298" class="root">대표 1</text><text x="819" y="298" class="label">{3}       {4}       {5}</text>

  <rect x="35" y="345" width="510" height="260" rx="20" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
  <circle cx="69" cy="379" r="19" fill="#16a34a"/><text x="69" y="386" text-anchor="middle" style="font-size:18px;font-weight:800;fill:#fff">3</text>
  <text x="101" y="386" class="card-title">union(3, 4): 다른 그룹도 합치기</text>
  <text x="64" y="417" class="label">find(1) = find(2), find(3) = find(4)</text>
  <rect x="65" y="444" width="187" height="80" rx="38" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <rect x="265" y="444" width="187" height="80" rx="38" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <g transform="translate(112 484)"><use href="#circle"/><text class="num">1</text></g>
  <g transform="translate(204 484)"><use href="#circle"/><text class="num">2</text></g>
  <g transform="translate(313 484)"><use href="#circle"/><text class="num">3</text></g>
  <g transform="translate(404 484)"><use href="#circle"/><text class="num">4</text></g>
  <g transform="translate(496 484)"><use href="#circle"/><text class="num">5</text></g>
  <text x="97" y="548" class="root">대표 1</text><text x="298" y="548" style="font-size:13px;font-weight:700;fill:#15803d">대표 3</text><text x="473" y="548" class="label">별개</text>

  <rect x="575" y="345" width="510" height="260" rx="20" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="2"/>
  <circle cx="609" cy="379" r="19" fill="#7c3aed"/><text x="609" y="386" text-anchor="middle" style="font-size:18px;font-weight:800;fill:#fff">4</text>
  <text x="641" y="386" class="card-title">union(2, 3): 두 그룹을 하나로</text>
  <text x="604" y="417" class="label">2의 대표는 1, 3의 대표는 3 → 대표끼리 연결</text>
  <rect x="605" y="444" width="362" height="80" rx="38" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <g transform="translate(650 484)"><use href="#circle"/><text class="num">1</text></g>
  <g transform="translate(740 484)"><use href="#circle"/><text class="num">2</text></g>
  <g transform="translate(830 484)"><use href="#circle"/><text class="num">3</text></g>
  <g transform="translate(920 484)"><use href="#circle"/><text class="num">4</text></g>
  <g transform="translate(1032 484)"><use href="#circle"/><text class="num">5</text></g>
  <text x="620" y="552" style="font-size:14px;font-weight:700;fill:#6d28d9">find(1) = find(4) = 1 → 같은 그룹</text>
  <text x="1011" y="552" class="label">별개</text>

  <text x="40" y="632" class="subtitle">표 병합에서는 각 숫자 대신 각 셀의 번호를 원소로 사용한다.</text>
</svg>
