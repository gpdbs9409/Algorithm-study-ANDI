<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">표 병합에서 Union-Find의 parent, find, values 변화</title>
  <desc id="desc">초기화, 병합, 경로 압축, 병합 해제 네 단계를 카드로 비교한다. C에 menu 값을 입력하고 A와 B를 병합한 뒤 C와 A를 병합하면 B에서 A를 거쳐 대표 C에 도달한다. find B 후 B는 C를 직접 가리키고, UNMERGE B 후 세 셀은 독립적으로 돌아가며 B만 menu 값을 가진다.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #1f2937; }
      .heading { font-size: 26px; font-weight: 800; }
      .sub { font-size: 16px; fill: #526174; }
      .card-title { font-size: 20px; font-weight: 750; }
      .label { font-size: 15px; font-weight: 700; fill: #526174; }
      .node { font-size: 23px; font-weight: 800; }
      .note { font-size: 16px; fill: #334155; }
      .small { font-size: 14px; fill: #475569; }
      .line { stroke: #718096; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .accent-line { stroke: #2563eb; stroke-width: 3.5; fill: none; marker-end: url(#blue-arrow); }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#718096"/></marker>
    <marker id="blue-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker>
  </defs>

  <rect width="1200" height="820" fill="#f8fafc"/>
  <text x="48" y="54" class="heading">Union-Find로 보는 표 병합</text>
  <text x="48" y="84" class="sub">parent는 그룹 관계를, values는 대표 셀의 값을 저장한다.</text>

  <rect x="42" y="116" width="548" height="292" rx="20" fill="#ffffff" stroke="#dbe3eb" stroke-width="2"/>
  <circle cx="76" cy="152" r="20" fill="#64748b"/><text x="70" y="159" style="fill:#fff;font-weight:800;font-size:18px">1</text>
  <text x="108" y="159" class="card-title">초기 상태: UPDATE C menu 후</text>
  <text x="70" y="190" class="note">각 셀은 자기 자신이 대표다.</text>
  <rect x="98" y="223" width="96" height="62" rx="12" fill="#e2e8f0"/>
  <rect x="250" y="223" width="96" height="62" rx="12" fill="#e2e8f0"/>
  <rect x="402" y="223" width="96" height="62" rx="12" fill="#e2e8f0"/>
  <text x="137" y="261" class="node">A</text><text x="289" y="261" class="node">B</text><text x="441" y="261" class="node">C</text>
  <text x="70" y="324" class="label">parent</text><text x="133" y="324" class="note">A</text><text x="285" y="324" class="note">B</text><text x="437" y="324" class="note">C</text>
  <text x="70" y="362" class="label">values</text><text x="128" y="362" class="note">null</text><text x="280" y="362" class="note">null</text><text x="417" y="362" class="note">"menu"</text>

  <rect x="610" y="116" width="548" height="292" rx="20" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <circle cx="644" cy="152" r="20" fill="#2563eb"/><text x="638" y="159" style="fill:#fff;font-weight:800;font-size:18px">2</text>
  <text x="676" y="159" class="card-title">MERGE A B → MERGE C A</text>
  <text x="638" y="190" class="note">B의 대표를 찾으면 A를 거쳐 C에 도착한다.</text>
  <rect x="662" y="223" width="96" height="62" rx="12" fill="#dbeafe"/>
  <rect x="814" y="223" width="96" height="62" rx="12" fill="#dbeafe"/>
  <rect x="966" y="223" width="96" height="62" rx="12" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <text x="701" y="261" class="node">A</text><text x="853" y="261" class="node">B</text><text x="1005" y="261" class="node">C</text>
  <path d="M815 253 H770" class="line"/><path d="M758 238 C830 205 913 205 966 238" class="line"/>
  <text x="638" y="324" class="label">parent</text><text x="697" y="324" class="note">C</text><text x="849" y="324" class="note">A</text><text x="1001" y="324" class="note">C</text>
  <text x="638" y="362" class="label">values</text><text x="692" y="362" class="note">null</text><text x="844" y="362" class="note">null</text><text x="981" y="362" class="note">"menu"</text>

  <rect x="42" y="428" width="548" height="336" rx="20" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <circle cx="76" cy="464" r="20" fill="#2563eb"/><text x="70" y="471" style="fill:#fff;font-weight:800;font-size:18px">3</text>
  <text x="108" y="471" class="card-title">find(B): 경로 압축</text>
  <text x="70" y="502" class="note">대표 C를 찾은 뒤 parent[B]를 C로 바꾼다.</text>
  <rect x="98" y="535" width="96" height="62" rx="12" fill="#dbeafe"/>
  <rect x="250" y="535" width="96" height="62" rx="12" fill="#dbeafe"/>
  <rect x="402" y="535" width="96" height="62" rx="12" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <text x="137" y="573" class="node">A</text><text x="289" y="573" class="node">B</text><text x="441" y="573" class="node">C</text>
  <path d="M346 552 C365 525 382 525 402 552" class="accent-line"/><text x="272" y="629" class="small">B → C로 바로 연결</text>
  <text x="70" y="669" class="label">parent</text><text x="133" y="669" class="note">C</text><text x="285" y="669" class="note">C</text><text x="437" y="669" class="note">C</text>
  <text x="70" y="712" class="label">값 조회</text><text x="160" y="712" class="note">find(B) = C  →  values[C] = "menu"</text>

  <rect x="610" y="428" width="548" height="336" rx="20" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
  <circle cx="644" cy="464" r="20" fill="#16a34a"/><text x="638" y="471" style="fill:#fff;font-weight:800;font-size:18px">4</text>
  <text x="676" y="471" class="card-title">UNMERGE B</text>
  <text x="638" y="502" class="note">세 셀을 분리하고 선택한 B에만 값을 남긴다.</text>
  <rect x="662" y="535" width="96" height="62" rx="12" fill="#dcfce7"/>
  <rect x="814" y="535" width="96" height="62" rx="12" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
  <rect x="966" y="535" width="96" height="62" rx="12" fill="#dcfce7"/>
  <text x="701" y="573" class="node">A</text><text x="853" y="573" class="node">B</text><text x="1005" y="573" class="node">C</text>
  <text x="638" y="669" class="label">parent</text><text x="697" y="669" class="note">A</text><text x="849" y="669" class="note">B</text><text x="1001" y="669" class="note">C</text>
  <text x="638" y="712" class="label">values</text><text x="692" y="712" class="note">null</text><text x="828" y="712" class="note">"menu"</text><text x="996" y="712" class="note">null</text>
  <text x="48" y="801" class="small">표의 실제 좌표는 getIndex(r, c)로 정수 번호로 바꾼 뒤 동일한 방식으로 처리한다.</text>
</svg>
